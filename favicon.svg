<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">第五人格随机抽取工具</title>
  <desc id="description">北京大学第五人格赛事 PIL 开发。金色骰子代表随机抽取，四颗青色角点代表求生者，中央红色菱形代表监管者，底部为 PIL 字样。</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eee0bb"/>
      <stop offset="1" stop-color="#b39158"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2a3138"/>
      <stop offset="1" stop-color="#181c21"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="24" fill="url(#ink)" stroke="#b39158" stroke-width="3"/>
  <g transform="translate(64 49) rotate(-12)">
    <rect x="-31" y="-31" width="62" height="62" rx="11" fill="#181c21" stroke="url(#gold)" stroke-width="4"/>
    <g fill="#61d5dd">
      <circle cx="-16" cy="-16" r="5"/>
      <circle cx="16" cy="-16" r="5"/>
      <circle cx="-16" cy="16" r="5"/>
      <circle cx="16" cy="16" r="5"/>
    </g>
    <path d="M0-8 8 0 0 8-8 0Z" fill="#b83a3c" stroke="#ddd0b1" stroke-width="1.5"/>
  </g>
  <path d="M39 112V96h8a5 5 0 0 1 0 10h-8M58 96h12m-6 0v16m-6 0h12M79 96v16h12" fill="none" stroke="#ddd0b1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
